name: Tests

# The XCTest suite cannot run on a Command Line Tools-only machine (XCTest ships
# with full Xcode). GitHub's macOS runners have Xcode preinstalled, so this is the
# canonical place the suite executes. It runs on every push and PR.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Swift unit suite (XCTest)
    # Swift 6 is required: WhisperKit's transitive dep swift-jinja ships a
    # swift-tools-version 6.0 manifest, which an older toolchain can't even read
    # (dependency resolution fails before any test runs). macos-15 defaults to
    # Xcode 16 (Swift 6); the step below also selects the newest Xcode present.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Swift 6+ needed for the dependency graph)
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcode-select -p
          swift --version

      # SPM checkouts and the .build tree are large (WhisperKit/SpeakerKit
      # CoreML packages + GRDB), and every cold run re-fetches and re-builds
      # them. Cache keyed on Package.resolved so a dependency change busts it
      # cleanly. Saves ~3–8 minutes per run on a warm cache hit.
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      # The enterprise unit suite — pure-logic and GRDB tests, fully hermetic
      # (in-memory DB, no network, no audio). This is the gate.
      - name: Run MeetingManagerTests
        run: swift test --filter MeetingManagerTests

      # Process-simulation detection tests (no real Zoom needed).
      - name: Run MeetingDetectionTests
        run: swift test --filter MeetingDetectionTests

      # Release compile gate — matches the bar in CLAUDE.md ("swift build -c
      # release must be clean before marking done").
      - name: Release build
        run: swift build -c release
