<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient: deep navy to rich blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <!-- Accent gradient for the waveform -->
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <!-- Mic gradient -->
    <linearGradient id="mic" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7C7CC"/>
    </linearGradient>
    <!-- Subtle inner shadow / glow -->
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Rounded square clip for macOS style -->
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <g clip-path="url(#roundedSquare)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <!-- Waveform bars (centered, behind the mic) -->
    <g transform="translate(512, 480)" opacity="0.9">
      <!-- Left side bars -->
      <rect x="-340" y="-60"  width="28" height="120" rx="14" fill="url(#wave)" opacity="0.4"/>
      <rect x="-290" y="-100" width="28" height="200" rx="14" fill="url(#wave)" opacity="0.55"/>
      <rect x="-240" y="-140" width="28" height="280" rx="14" fill="url(#wave)" opacity="0.7"/>
      <rect x="-190" y="-180" width="28" height="360" rx="14" fill="url(#wave)" opacity="0.85"/>
      <rect x="-140" y="-130" width="28" height="260" rx="14" fill="url(#wave)" opacity="0.7"/>
      <rect x="-90"  y="-80"  width="28" height="160" rx="14" fill="url(#wave)" opacity="0.55"/>

      <!-- Right side bars (mirrored) -->
      <rect x="62"   y="-80"  width="28" height="160" rx="14" fill="url(#wave)" opacity="0.55"/>
      <rect x="112"  y="-130" width="28" height="260" rx="14" fill="url(#wave)" opacity="0.7"/>
      <rect x="162"  y="-180" width="28" height="360" rx="14" fill="url(#wave)" opacity="0.85"/>
      <rect x="212"  y="-140" width="28" height="280" rx="14" fill="url(#wave)" opacity="0.7"/>
      <rect x="262"  y="-100" width="28" height="200" rx="14" fill="url(#wave)" opacity="0.55"/>
      <rect x="312"  y="-60"  width="28" height="120" rx="14" fill="url(#wave)" opacity="0.4"/>
    </g>

    <!-- Microphone icon (centered) -->
    <g transform="translate(512, 440)">
      <!-- Mic body -->
      <rect x="-38" y="-100" width="76" height="160" rx="38" fill="url(#mic)"/>

      <!-- Mic arc (the U-shaped holder) -->
      <path d="M -60,20
               A 60,60 0 0,0 60,20"
            fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

      <!-- Mic stand -->
      <line x1="0" y1="80" x2="0" y2="130" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
      <!-- Mic base -->
      <line x1="-35" y1="130" x2="35" y2="130" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Recording dot (top-right area) -->
    <circle cx="740" cy="280" r="32" fill="#FF453A" opacity="0.95"/>
    <circle cx="740" cy="280" r="18" fill="#FF453A" opacity="0.5">
      <animate attributeName="r" values="18;28;18" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Subtle bottom text area -->
    <text x="512" y="700" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="72" font-weight="600" fill="white" opacity="0.85" letter-spacing="2">MEETING</text>
    <text x="512" y="770" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="72" font-weight="300" fill="white" opacity="0.55" letter-spacing="6">MANAGER</text>
  </g>
</svg>
